# Slovenia (Slovenija) - Unitary Republic

jurisdiction:
  iso_code: SI
  name:
    en: Slovenia
    native: Slovenija
  eu_member_since: "2004-05-01"
  languages:
    - sl

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national

  court_structure:
    constitutional:
      - name:
          en: Constitutional Court
          native: Ustavno sodišče
        code: US
        ecli_code: SI:USRS
        level: constitutional
        jurisdiction_scope: national

    supreme:
      - name:
          en: Supreme Court
          native: Vrhovno sodišče
        code: VS
        ecli_code: SI:VSRS
        level: supreme
        jurisdiction_scope: national

    appellate:
      - name:
          en: Higher Courts
          native: Višja sodišča
        code: VSC
        level: appellate
        jurisdiction_scope: regional

sources:
  legislation:
    - name: Pravno-informacijski sistem (PIS)
      url: https://www.pisrs.si
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1991"
          to: present
        content:
          - All Slovenian legislation
          - Consolidated texts
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: si/pisrs

    - name: Uradni list (Official Gazette)
      url: https://www.uradni-list.si
      type: official_gazette
      coverage:
        temporal:
          from: "1991"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p1
      job_id: si/uradnilist

    - name: N-Lex Slovenia
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=SI
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Supreme Court Database
      url: https://www.sodnapraksa.si
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - All court levels
      formats:
        - html
      access: open
      priority: p0
      job_id: si/sodnapraksa
      notes: Comprehensive unified portal

    - name: Constitutional Court
      url: https://www.us-rs.si
      type: court_database
      coverage:
        temporal:
          from: "1991"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: si/usrs

    - name: ECLI Search - Slovenia
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-si-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: UL Reference
    patterns:
      - name: Uradni list
        regex: "^Uradni list RS,? št\\.? [0-9]+/[0-9]{2,4}$"
        example: "Uradni list RS, št. 33/07"

  case_law:
    ecli_support: true
    ecli_country_code: SI
    national_schemes:
      - name: ECLI
        pattern: "ECLI:SI:[A-Z]+:[0-9]{4}:[A-Z0-9.]+"
        example: "ECLI:SI:VSRS:2020:VS00012345"

coverage_plan:
  p80_legislation:
    strategy: PIS is comprehensive
    targets:
      - source_ref: Pravno-informacijski sistem
        scope: All legislation
        estimated_docs: 8000
        priority: p0
        status: planned

  p80_case_law:
    strategy: sodnapraksa.si covers all courts
    targets:
      - source_ref: Supreme Court Database
        scope: All published decisions
        estimated_docs: 50000
        priority: p0
        status: planned

  backlog:
    - id: si-historical
      description: Yugoslav-era legislation (historical)
      type: legislation
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: false
  bulk_download: false
  notes: Good official portals with comprehensive coverage

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
