# Portugal - Unitary Republic with Autonomous Regions

jurisdiction:
  iso_code: PT
  name:
    en: Portugal
    native: Portugal
  eu_member_since: "1986-01-01"
  languages:
    - pt

legal_system:
  type: devolved
  hierarchy:
    levels:
      - name: National
        code: national
      - name: Autonomous Regions
        code: autonomous
        subdivisions:
          - name: Azores
            code: AZ
          - name: Madeira
            code: MA

  court_structure:
    constitutional:
      - name:
          en: Constitutional Court
          native: Tribunal Constitucional
        code: TC
        ecli_code: PT:TC
        level: constitutional
        jurisdiction_scope: national

    supreme:
      - name:
          en: Supreme Court of Justice
          native: Supremo Tribunal de Justiça
        code: STJ
        ecli_code: PT:STJ
        level: supreme
        jurisdiction_scope: national
      - name:
          en: Supreme Administrative Court
          native: Supremo Tribunal Administrativo
        code: STA
        ecli_code: PT:STA
        level: supreme
        jurisdiction_scope: national

    appellate:
      - name:
          en: Courts of Appeal (Relações)
          native: Tribunais da Relação
        code: TR
        level: appellate
        jurisdiction_scope: regional

sources:
  legislation:
    - name: DRE (Diário da República Eletrónico)
      url: https://dre.pt
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1910"
          to: present
        content:
          - All Portuguese legislation
          - Consolidated texts
          - Treaties
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: pt/dre
      notes: |
        Official electronic gazette.
        Excellent coverage and structure.
        API available.

    - name: PGDL (Legal Documentation Portal)
      url: https://www.pgdlisboa.pt
      type: legislation_portal
      coverage:
        temporal:
          from: varies
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p1
      job_id: pt/pgdl

    - name: N-Lex Portugal
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=PT
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: DGSI (Jurisprudence Database)
      url: https://www.dgsi.pt
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - STJ decisions
          - STA decisions
          - Courts of Appeal
          - Constitutional Court
      formats:
        - html
      access: open
      priority: p0
      job_id: pt/dgsi
      notes: Comprehensive official portal

    - name: Constitutional Court
      url: https://www.tribunalconstitucional.pt
      type: court_database
      coverage:
        temporal:
          from: "1983"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: pt/tc

    - name: ECLI Search - Portugal
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-pt-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: DR Reference
    patterns:
      - name: Diário da República
        regex: "^DR,? [0-9]+ª? Série,? n\\.?º? [0-9]+/[0-9]{4}$"
        example: "DR, 1.ª Série, n.º 123/2020"
      - name: Law Number
        regex: "^Lei n\\.?º? [0-9]+/[0-9]{4}$"
        example: "Lei n.º 67/2007"

  case_law:
    ecli_support: true
    ecli_country_code: PT
    national_schemes:
      - name: Process Number
        pattern: "[0-9]+/[0-9]{2}\\.[0-9][A-Z]+"
        example: "1234/20.9YFLSB"

coverage_plan:
  p80_legislation:
    strategy: DRE is comprehensive with API
    targets:
      - source_ref: DRE
        scope: All consolidated legislation
        estimated_docs: 50000
        priority: p0
        status: planned

  p80_case_law:
    strategy: DGSI covers all major courts
    targets:
      - source_ref: DGSI
        scope: Supreme courts and appeals
        estimated_docs: 100000
        priority: p0
        status: planned

  backlog:
    - id: pt-autonomous
      description: Azores and Madeira specific legislation
      type: legislation
      priority: p2
      status: planned
    - id: pt-first-instance
      description: First instance court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: true
  bulk_download: false
  notes: DRE has good API access

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
