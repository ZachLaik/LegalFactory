access:
  model: open
  rate_limits:
    requests_per_second: 2
    requests_per_day: null
    notes: Official portals are generally permissive
  robots_txt:
    allows_crawling: true
    disallowed_paths: []
  api_available: false
  bulk_download: true
  notes: |
    German official legal portals are very crawler-friendly.
    XML exports available from major sources.
    No API but well-structured HTML/XML.
    BGBl requires free registration for full access.

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
  notes: |
    Germany's federal structure creates complexity - 16 separate state legal systems.
    80/20 focuses on federal level first.
    Gesetze im Internet is the gold standard for consolidated law.
