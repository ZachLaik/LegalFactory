# France (République française) - Unitary Republic
# Centralized legal system with overseas territories

jurisdiction:
  iso_code: FR
  name:
    en: France
    native: France
  eu_member_since: "1958-01-01"  # Founding member
  languages:
    - fr

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national
        description: National legislation and national courts
      - name: Overseas Collectivities
        code: overseas
        description: Special status territories with some legislative autonomy
        subdivisions:
          - name: New Caledonia
            code: NC
          - name: French Polynesia
            code: PF
          - name: Wallis and Futuna
            code: WF
          - name: Saint-Barthélemy
            code: BL
          - name: Saint-Martin
            code: MF
          - name: Saint Pierre and Miquelon
            code: PM

  court_structure:
    constitutional:
      - name:
          en: Constitutional Council
          native: Conseil constitutionnel
        code: CC
        ecli_code: FR:CC
        level: constitutional
        jurisdiction_scope: national
        notes: Reviews constitutionality of laws, not a court in traditional sense

    supreme:
      - name:
          en: Court of Cassation
          native: Cour de cassation
        code: CCASS
        ecli_code: FR:CCASS
        level: supreme
        jurisdiction_scope: national
        notes: Supreme court for civil and criminal matters
      - name:
          en: Council of State
          native: Conseil d'État
        code: CE
        ecli_code: FR:CE
        level: supreme
        jurisdiction_scope: national
        notes: Supreme administrative court, also advisory body

    appellate:
      - name:
          en: Courts of Appeal
          native: Cours d'appel
        code: CA
        ecli_code: FR:CA*
        level: appellate
        jurisdiction_scope: regional
        notes: 36 courts of appeal across France
      - name:
          en: Administrative Courts of Appeal
          native: Cours administratives d'appel
        code: CAA
        ecli_code: FR:CAA*
        level: appellate
        jurisdiction_scope: regional
        notes: 8 administrative courts of appeal

    specialized:
      - name:
          en: Court of Audit
          native: Cour des comptes
        code: CCOMPTES
        ecli_code: FR:CCOMPTES
        level: specialized
        jurisdiction_scope: national
      - name:
          en: Conflicts Tribunal
          native: Tribunal des conflits
        code: TC
        ecli_code: FR:TC
        level: specialized
        jurisdiction_scope: national
        notes: Resolves jurisdictional conflicts between judicial and administrative orders

sources:
  legislation:
    - name: Légifrance
      url: https://www.legifrance.gouv.fr
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1539"
          to: present
          notes: Historical texts and all current law
        content:
          - Constitution
          - Codes (60+ codes)
          - Laws (lois)
          - Ordinances (ordonnances)
          - Decrees (décrets)
          - Ministerial orders (arrêtés)
          - EU law transpositions
      formats:
        - html
        - pdf
        - xml
      access: open
      priority: p0
      job_id: fr/legifrance
      notes: |
        Authoritative source for all French law.
        LEGI database for legislation, JORF for gazette.
        API available (PISTE platform).
        Excellent XML structure (Legistix format).

    - name: Journal Officiel (JORF)
      url: https://www.legifrance.gouv.fr/jorf
      type: official_gazette
      coverage:
        temporal:
          from: "1869"
          to: present
          notes: Official gazette
        content:
          - All enacted legislation
          - Regulatory texts
          - Official announcements
      formats:
        - html
        - pdf
        - xml
      access: open
      priority: p1
      job_id: fr/jorf
      notes: Integrated into Légifrance

    - name: N-Lex France Portal
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=FR
      type: n_lex_gateway
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Links to French legal databases
      formats:
        - html
      access: open
      priority: p2
      notes: Gateway pointing to Légifrance

    - name: PISTE API
      url: https://piste.gouv.fr
      type: api
      coverage:
        temporal:
          from: "1539"
          to: present
        content:
          - Légifrance data via API
      formats:
        - json
        - xml
      access: registration
      priority: p0
      job_id: fr/piste_api
      notes: |
        Official API for Légifrance.
        Free registration required.
        Rate limited but generous quotas.

  case_law:
    - name: Légifrance Jurisprudence
      url: https://www.legifrance.gouv.fr/search/juri
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
          notes: Coverage varies by court
        content:
          - Conseil constitutionnel decisions
          - Cour de cassation decisions
          - Conseil d'État decisions
          - Cour des comptes decisions
          - Courts of appeal (selected)
      formats:
        - html
        - pdf
        - xml
      access: open
      priority: p0
      job_id: fr/legifrance_jurisprudence
      notes: |
        Primary portal for French case law.
        ECLI identifiers available for major courts.
        JURI database.

    - name: Conseil constitutionnel
      url: https://www.conseil-constitutionnel.fr
      type: court_database
      coverage:
        temporal:
          from: "1958"
          to: present
        content:
          - All CC decisions
          - QPC (priority constitutional questions)
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: fr/conseil_constitutionnel
      notes: Complete archive of constitutional decisions

    - name: Cour de cassation
      url: https://www.courdecassation.fr
      type: court_database
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Published decisions
          - Rapports annuels
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: fr/cour_cassation
      notes: Official Court of Cassation portal

    - name: Conseil d'État
      url: https://www.conseil-etat.fr
      type: court_database
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Administrative decisions
          - Avis (opinions)
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: fr/conseil_etat
      notes: Supreme administrative court portal

    - name: ECLI Search - France
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-fr-en.do
      type: ecli_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Indexed French case law with ECLI
      formats:
        - html
      access: open
      priority: p1
      job_id: fr/ecli_search
      notes: EU portal indexing French decisions with ECLI

identifiers:
  legislation:
    primary_scheme: NOR
    patterns:
      - name: NOR Identifier
        regex: "^[A-Z]{4}[0-9]{7}[A-Z]$"
        example: "PRMX0100000A"
        description: |
          Numéro d'Ordre du Répertoire - unique ID for each text
          Format: 4 letters (ministry) + 7 digits (year+sequence) + 1 letter (type)
      - name: JORF Reference
        regex: "^JORF(TEXT|CONT)[0-9]{12}$"
        example: "JORFTEXT000000000001"
        description: JORF database identifier
      - name: LEGI ID
        regex: "^LEGI(TEXT|ARTI|SCTA)[0-9]{12}$"
        example: "LEGITEXT000006070721"
        description: Légifrance database identifier

  case_law:
    ecli_support: true
    ecli_country_code: FR
    national_schemes:
      - name: ECLI
        pattern: "ECLI:FR:[A-Z]+:[0-9]{4}:[A-Z0-9.]+"
        example: "ECLI:FR:CCASS:2020:CR00123"
      - name: Decision Number
        pattern: "[0-9]{2}-[0-9]{5}"
        example: "20-12345"
        description: Cour de cassation numbering (year-sequence)
      - name: QPC Number
        pattern: "[0-9]{4}-[0-9]+ QPC"
        example: "2020-800 QPC"
        description: Priority constitutional question reference

coverage_plan:
  p80_legislation:
    strategy: |
      Légifrance is the single authoritative source.
      Use PISTE API for structured access.
      Start with consolidated Codes (most important texts).
      Then general legislation (lois, ordonnances).
      Defer regulatory texts (décrets, arrêtés) to P1.
    targets:
      - source_ref: Légifrance
        scope: All major Codes (60+ codes)
        estimated_docs: 65
        priority: p0
        status: planned
        notes: Code civil, Code pénal, Code du travail, etc.
      - source_ref: Légifrance
        scope: Laws (lois) in force
        estimated_docs: 15000
        priority: p0
        status: planned
      - source_ref: Légifrance
        scope: Ordinances in force
        estimated_docs: 3000
        priority: p1
        status: planned
      - source_ref: PISTE API
        scope: Structured data access
        estimated_docs: null
        priority: p0
        status: planned
        notes: API integration for efficient crawling

  p80_case_law:
    strategy: |
      Start with supreme courts: CC, Cour de cassation, Conseil d'État.
      Use ECLI identifiers where available.
      Légifrance jurisprudence is the integrated source.
      Defer lower courts to backlog.
    targets:
      - source_ref: Conseil constitutionnel
        scope: All decisions (1958+)
        estimated_docs: 5000
        priority: p0
        status: planned
      - source_ref: Cour de cassation
        scope: Published decisions
        estimated_docs: 80000
        priority: p0
        status: planned
      - source_ref: Conseil d'État
        scope: Published decisions
        estimated_docs: 50000
        priority: p0
        status: planned
      - source_ref: Légifrance Jurisprudence
        scope: Cross-reference and gap filling
        estimated_docs: null
        priority: p1
        status: planned

  backlog:
    # Legislation backlog
    - id: fr-decrets
      description: Regulatory decrees (décrets)
      type: legislation
      priority: p1
      status: planned
    - id: fr-arretes
      description: Ministerial orders (arrêtés)
      type: legislation
      priority: p2
      status: planned
    - id: fr-circulaires
      description: Administrative circulars
      type: legislation
      priority: p2
      status: planned
    - id: fr-historical
      description: Historical texts pre-1945
      type: legislation
      priority: p2
      status: planned
    - id: fr-overseas
      description: Overseas territory specific legislation
      type: legislation
      priority: p2
      status: planned

    # Case law backlog
    - id: fr-ca-appeal
      description: Courts of appeal decisions
      type: case_law
      priority: p1
      status: planned
    - id: fr-caa-admin
      description: Administrative courts of appeal
      type: case_law
      priority: p1
      status: planned
    - id: fr-ccomptes
      description: Court of Audit decisions
      type: case_law
      priority: p2
      status: planned
    - id: fr-tc-conflicts
      description: Conflicts Tribunal decisions
      type: case_law
      priority: p2
      status: planned
    - id: fr-tgi-first
      description: First instance court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 5
    requests_per_day: 50000
    notes: PISTE API has documented rate limits
  robots_txt:
    allows_crawling: true
    disallowed_paths:
      - /affichTexte/
      - /loda/
  api_available: true
  bulk_download: false
  notes: |
    France has the best-organized legal data infrastructure in EU.
    Légifrance is comprehensive and well-structured.
    PISTE API provides official programmatic access.
    Registration required for API but free.

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
  notes: |
    France is a model jurisdiction for legal data access.
    Légifrance + PISTE API is the gold standard.
    Unitary system makes coverage simpler than federal states.
