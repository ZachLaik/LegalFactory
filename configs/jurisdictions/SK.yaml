# Slovakia (Slovensko) - Unitary Republic

jurisdiction:
  iso_code: SK
  name:
    en: Slovakia
    native: Slovensko
  eu_member_since: "2004-05-01"
  languages:
    - sk

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national

  court_structure:
    constitutional:
      - name:
          en: Constitutional Court
          native: Ústavný súd
        code: US
        ecli_code: SK:US
        level: constitutional
        jurisdiction_scope: national

    supreme:
      - name:
          en: Supreme Court
          native: Najvyšší súd
        code: NS
        ecli_code: SK:NS
        level: supreme
        jurisdiction_scope: national
      - name:
          en: Supreme Administrative Court
          native: Najvyšší správny súd
        code: NSS
        ecli_code: SK:NSS
        level: supreme
        jurisdiction_scope: national
        notes: Established 2021

sources:
  legislation:
    - name: Slov-Lex
      url: https://www.slov-lex.sk
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1993"
          to: present
        content:
          - All Slovak legislation
          - Consolidated texts
          - EU law transpositions
      formats:
        - html
        - pdf
        - xml
      access: open
      priority: p0
      job_id: sk/slovlex
      notes: Excellent official portal with API

    - name: Zbierka zákonov (Collection of Laws)
      url: https://www.zbierka.sk
      type: official_gazette
      coverage:
        temporal:
          from: "1993"
          to: present
      formats:
        - pdf
      access: open
      priority: p1
      job_id: sk/zbierka

    - name: N-Lex Slovakia
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=SK
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Súdne rozhodnutia (Court Decisions)
      url: https://www.judikatura.sk
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Supreme Court
          - Constitutional Court
          - Regional courts
      formats:
        - html
      access: open
      priority: p0
      job_id: sk/judikatura

    - name: Constitutional Court
      url: https://www.ustavnysud.sk
      type: court_database
      coverage:
        temporal:
          from: "1993"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: sk/ustavnysud

    - name: ECLI Search - Slovakia
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-sk-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: Z.z. Number
    patterns:
      - name: Collection Number
        regex: "^[0-9]+/[0-9]{4} Z\\.?z\\.?$"
        example: "40/1964 Z.z."

  case_law:
    ecli_support: true
    ecli_country_code: SK
    national_schemes:
      - name: Sp. zn. (File Number)
        pattern: "[0-9]+ [A-Za-z]+ [0-9]+/[0-9]+"
        example: "1 Cdo 123/2020"

coverage_plan:
  p80_legislation:
    strategy: Slov-Lex is comprehensive with API
    targets:
      - source_ref: Slov-Lex
        scope: All legislation
        estimated_docs: 10000
        priority: p0
        status: planned

  p80_case_law:
    strategy: Use official court portals
    targets:
      - source_ref: Súdne rozhodnutia
        scope: Supreme court decisions
        estimated_docs: 30000
        priority: p0
        status: planned
      - source_ref: Constitutional Court
        scope: US decisions
        estimated_docs: 3000
        priority: p0
        status: planned

  backlog:
    - id: sk-regional-courts
      description: Regional court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: true
  bulk_download: false
  notes: Slov-Lex has good API access

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
