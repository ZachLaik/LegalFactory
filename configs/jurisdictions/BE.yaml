# Belgium (België/Belgique/Belgien) - Federal State
# Complex federal system with 3 regions and 3 communities

jurisdiction:
  iso_code: BE
  name:
    en: Belgium
    native: België / Belgique / Belgien
  eu_member_since: "1958-01-01"  # Founding member
  languages:
    - nl  # Dutch
    - fr  # French
    - de  # German

legal_system:
  type: federal
  hierarchy:
    levels:
      - name: Federal
        code: federal
      - name: Regions
        code: region
        subdivisions:
          - name: Flanders (Vlaanderen)
            code: VL
          - name: Wallonia (Wallonie)
            code: WA
          - name: Brussels-Capital Region
            code: BR
      - name: Communities
        code: community
        subdivisions:
          - name: Flemish Community
            code: VG
          - name: French Community
            code: FG
          - name: German-speaking Community
            code: DG

  court_structure:
    constitutional:
      - name:
          en: Constitutional Court
          native: Grondwettelijk Hof / Cour constitutionnelle
        code: GwH
        ecli_code: BE:GHCC
        level: constitutional
        jurisdiction_scope: national

    supreme:
      - name:
          en: Court of Cassation
          native: Hof van Cassatie / Cour de cassation
        code: Cass
        ecli_code: BE:CASS
        level: supreme
        jurisdiction_scope: national
      - name:
          en: Council of State
          native: Raad van State / Conseil d'État
        code: RvS
        ecli_code: BE:RVS
        level: supreme
        jurisdiction_scope: national

    appellate:
      - name:
          en: Courts of Appeal
          native: Hoven van beroep / Cours d'appel
        code: HvB
        level: appellate
        jurisdiction_scope: regional

sources:
  legislation:
    - name: Belgisch Staatsblad / Moniteur Belge
      url: https://www.ejustice.just.fgov.be/cgi/welcome.pl
      type: official_gazette
      coverage:
        temporal:
          from: "1831"
          to: present
        content:
          - All federal legislation
          - Regional and community legislation
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: be/staatsblad

    - name: Justel (Consolidated Legislation)
      url: https://www.ejustice.just.fgov.be/cgi_loi/loi.pl
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1804"
          to: present
        content:
          - Consolidated Belgian law
      formats:
        - html
      access: open
      priority: p0
      job_id: be/justel

    - name: N-Lex Belgium
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=BE
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Juridat
      url: https://juportal.be/
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Court of Cassation
          - Courts of Appeal
          - First instance courts
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: be/juridat

    - name: Constitutional Court Decisions
      url: https://www.const-court.be
      type: court_database
      coverage:
        temporal:
          from: "1985"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: be/const_court

    - name: ECLI Search - Belgium
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-be-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: BS/MB Reference
    patterns:
      - name: Staatsblad/Moniteur
        regex: "^(BS|MB) [0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]+"
        example: "BS 2020-03-15/01"

  case_law:
    ecli_support: true
    ecli_country_code: BE
    national_schemes:
      - name: ECLI
        pattern: "ECLI:BE:[A-Z]+:[0-9]{4}:[A-Z0-9.]+"
        example: "ECLI:BE:CASS:2020:ARR.20200115.1"

coverage_plan:
  p80_legislation:
    strategy: Use Justel for consolidated law, Staatsblad for gazette
    targets:
      - source_ref: Justel
        scope: Consolidated federal legislation
        estimated_docs: 15000
        priority: p0
        status: planned

  p80_case_law:
    strategy: Focus on supreme courts first
    targets:
      - source_ref: Juridat
        scope: Court of Cassation decisions
        estimated_docs: 30000
        priority: p0
        status: planned
      - source_ref: Constitutional Court Decisions
        scope: All decisions
        estimated_docs: 3000
        priority: p0
        status: planned

  backlog:
    - id: be-regional-law
      description: Regional/community specific legislation
      type: legislation
      priority: p1
      status: planned
    - id: be-lower-courts
      description: Lower court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: false
  bulk_download: false
  notes: Multiple languages complicate processing

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
  notes: Complex federal structure with three official languages
