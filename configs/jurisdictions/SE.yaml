# Sweden (Sverige) - Unitary Constitutional Monarchy

jurisdiction:
  iso_code: SE
  name:
    en: Sweden
    native: Sverige
  eu_member_since: "1995-01-01"
  languages:
    - sv

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national

  court_structure:
    supreme:
      - name:
          en: Supreme Court
          native: Högsta domstolen
        code: HD
        ecli_code: SE:HD
        level: supreme
        jurisdiction_scope: national
      - name:
          en: Supreme Administrative Court
          native: Högsta förvaltningsdomstolen
        code: HFD
        ecli_code: SE:HFD
        level: supreme
        jurisdiction_scope: national

    appellate:
      - name:
          en: Courts of Appeal
          native: Hovrätterna
        code: HovR
        level: appellate
        jurisdiction_scope: regional
      - name:
          en: Administrative Courts of Appeal
          native: Kammarrätterna
        code: KamR
        level: appellate
        jurisdiction_scope: regional

sources:
  legislation:
    - name: Riksdagen (Parliament) Legislation
      url: https://www.riksdagen.se/sv/dokument-lagar/
      type: consolidated_legislation
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Swedish Code of Statutes (SFS)
          - Consolidated versions
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: se/riksdagen

    - name: Lagrummet
      url: https://lagrummet.se
      type: legislation_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Legal information portal
      formats:
        - html
      access: open
      priority: p1
      job_id: se/lagrummet

    - name: N-Lex Sweden
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=SE
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Domstol.se
      url: https://www.domstol.se
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - Selected court decisions
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: se/domstol

    - name: Lagrummet Case Law
      url: https://rattsinfosok.dom.se
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - HD and HFD decisions
      formats:
        - html
      access: open
      priority: p0
      job_id: se/rattsinfosok

    - name: ECLI Search - Sweden
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-se-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: SFS Number
    patterns:
      - name: SFS Number
        regex: "^SFS [0-9]{4}:[0-9]+$"
        example: "SFS 2020:1234"

  case_law:
    ecli_support: true
    ecli_country_code: SE
    national_schemes:
      - name: NJA Reference
        pattern: "^NJA [0-9]{4} s\\. [0-9]+$"
        example: "NJA 2020 s. 123"
        description: Nytt Juridiskt Arkiv (Supreme Court reporter)

coverage_plan:
  p80_legislation:
    strategy: Use Riksdagen for SFS legislation
    targets:
      - source_ref: Riksdagen
        scope: All SFS legislation
        estimated_docs: 15000
        priority: p0
        status: planned

  p80_case_law:
    strategy: Use official court portals
    targets:
      - source_ref: Lagrummet Case Law
        scope: Supreme courts decisions
        estimated_docs: 20000
        priority: p0
        status: planned

  backlog:
    - id: se-lower-courts
      description: District and administrative court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: false
  bulk_download: false

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
