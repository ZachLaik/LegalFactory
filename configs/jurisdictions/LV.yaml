# Latvia (Latvija) - Unitary Republic

jurisdiction:
  iso_code: LV
  name:
    en: Latvia
    native: Latvija
  eu_member_since: "2004-05-01"
  languages:
    - lv

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national

  court_structure:
    constitutional:
      - name:
          en: Constitutional Court
          native: Satversmes tiesa
        code: ST
        ecli_code: LV:ST
        level: constitutional
        jurisdiction_scope: national

    supreme:
      - name:
          en: Supreme Court
          native: Augstākā tiesa
        code: AT
        ecli_code: LV:AT
        level: supreme
        jurisdiction_scope: national

sources:
  legislation:
    - name: Likumi.lv
      url: https://likumi.lv
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1990"
          to: present
        content:
          - All Latvian legislation
          - Consolidated texts
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: lv/likumi

    - name: Latvijas Vēstnesis (Official Gazette)
      url: https://www.vestnesis.lv
      type: official_gazette
      coverage:
        temporal:
          from: "1993"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p1
      job_id: lv/vestnesis

    - name: N-Lex Latvia
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=LV
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Manas tiesas (Court Portal)
      url: https://manas.tiesas.lv
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: lv/manastiesas

    - name: Constitutional Court
      url: https://www.satv.tiesa.gov.lv
      type: court_database
      coverage:
        temporal:
          from: "1996"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: lv/satversmes

    - name: ECLI Search - Latvia
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-lv-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: LV Reference
    patterns:
      - name: Latvijas Vēstnesis
        regex: "^Latvijas Vēstnesis,? [0-9]+,? [0-9]{2}\\.[0-9]{2}\\.[0-9]{4}$"
        example: "Latvijas Vēstnesis, 123, 01.06.2020"

  case_law:
    ecli_support: true
    ecli_country_code: LV

coverage_plan:
  p80_legislation:
    strategy: Likumi.lv is comprehensive
    targets:
      - source_ref: Likumi.lv
        scope: All legislation
        estimated_docs: 10000
        priority: p0
        status: planned

  p80_case_law:
    strategy: Use official court portal
    targets:
      - source_ref: Manas tiesas
        scope: Supreme Court decisions
        estimated_docs: 20000
        priority: p0
        status: planned

  backlog:
    - id: lv-lower-courts
      description: Regional court decisions
      type: case_law
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: false
  bulk_download: false

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
