# Estonia (Eesti) - Unitary Republic

jurisdiction:
  iso_code: EE
  name:
    en: Estonia
    native: Eesti
  eu_member_since: "2004-05-01"
  languages:
    - et

legal_system:
  type: unitary
  hierarchy:
    levels:
      - name: National
        code: national

  court_structure:
    constitutional:
      - name:
          en: Constitutional Review Chamber of Supreme Court
          native: Riigikohtu põhiseaduslikkuse järelevalve kolleegium
        code: RKPSJK
        level: constitutional
        jurisdiction_scope: national
        notes: Part of Supreme Court, not separate court

    supreme:
      - name:
          en: Supreme Court
          native: Riigikohus
        code: RK
        ecli_code: EE:RK
        level: supreme
        jurisdiction_scope: national

    appellate:
      - name:
          en: Circuit Courts
          native: Ringkonnakohtud
        code: RnK
        level: appellate
        jurisdiction_scope: regional

sources:
  legislation:
    - name: Riigi Teataja (State Gazette)
      url: https://www.riigiteataja.ee
      type: consolidated_legislation
      coverage:
        temporal:
          from: "1990"
          to: present
        content:
          - All Estonian legislation
          - Consolidated versions
          - Historical versions
      formats:
        - html
        - xml
        - pdf
      access: open
      priority: p0
      job_id: ee/riigiteataja
      notes: |
        Excellent digital-first legal database.
        API available, XML exports.
        Model for other countries.

    - name: N-Lex Estonia
      url: https://n-lex.europa.eu/n-lex/pays.html?lang=en&pays=EE
      type: n_lex_gateway
      access: open
      priority: p2

  case_law:
    - name: Riigikohus (Supreme Court)
      url: https://www.riigikohus.ee
      type: court_database
      coverage:
        temporal:
          from: "1993"
          to: present
      formats:
        - html
        - pdf
      access: open
      priority: p0
      job_id: ee/riigikohus

    - name: Kohtulahendid (Court Decisions Portal)
      url: https://www.riigiteataja.ee/kohtulahendid/
      type: case_law_portal
      coverage:
        temporal:
          from: varies
          to: present
        content:
          - All court levels
      formats:
        - html
      access: open
      priority: p0
      job_id: ee/kohtulahendid

    - name: ECLI Search - Estonia
      url: https://e-justice.europa.eu/content_ecli_search_engine-430-ee-en.do
      type: ecli_portal
      access: open
      priority: p1

identifiers:
  legislation:
    primary_scheme: RT Reference
    patterns:
      - name: Riigi Teataja
        regex: "^RT I,? [0-9]{2}\\.[0-9]{2}\\.[0-9]{4},? [0-9]+$"
        example: "RT I, 06.01.2023, 1"

  case_law:
    ecli_support: true
    ecli_country_code: EE
    national_schemes:
      - name: Case Number
        pattern: "[0-9]-[0-9]+-[0-9]+-[0-9]+"
        example: "3-1-1-100-20"

coverage_plan:
  p80_legislation:
    strategy: Riigi Teataja is the gold standard
    targets:
      - source_ref: Riigi Teataja
        scope: All legislation
        estimated_docs: 6000
        priority: p0
        status: planned

  p80_case_law:
    strategy: Use integrated court decisions portal
    targets:
      - source_ref: Kohtulahendid
        scope: All published decisions
        estimated_docs: 40000
        priority: p0
        status: planned

  backlog:
    - id: ee-historical
      description: Soviet-era legislation (historical reference)
      type: legislation
      priority: p2
      status: planned

access:
  model: open
  rate_limits:
    requests_per_second: 2
  api_available: true
  bulk_download: true
  notes: |
    Estonia has one of the best legal data infrastructures in Europe.
    Riigi Teataja is a model for e-government in legal publishing.

metadata:
  last_updated: "2025-01-21"
  maintainer: LegalDataFactory
  status: active
  notes: Model jurisdiction for digital legal data
