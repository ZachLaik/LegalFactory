name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID to test (e.g., eu/eurlex_legislation)'
        required: true
        type: string
      limit:
        description: 'Number of documents to fetch'
        required: false
        default: '1'
        type: string

# Only allow one integration test at a time
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration  # Requires approval

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration test
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          EURLEX_API_KEY: ${{ secrets.EURLEX_API_KEY }}
        run: |
          ldf run ${{ inputs.job_id }} --limit ${{ inputs.limit }} --dry-run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            logs/
            *.json
