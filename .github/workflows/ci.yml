name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy cli core jobs --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run fixture tests
        run: pytest tests/fixtures -v --tb=short

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate jurisdiction configs
        run: |
          python -c "
          import yaml
          import json
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schema_path = Path('configs/schemas/jurisdiction.schema.json')
          schema = json.loads(schema_path.read_text())

          configs_dir = Path('configs/jurisdictions')
          errors = []

          for config_file in configs_dir.glob('*.yaml'):
              try:
                  with open(config_file) as f:
                      config = yaml.safe_load(f)
                  validate(instance=config, schema=schema)
                  print(f'✓ {config_file.name}')
              except ValidationError as e:
                  errors.append(f'{config_file.name}: {e.message}')
                  print(f'✗ {config_file.name}: {e.message}')
              except Exception as e:
                  errors.append(f'{config_file.name}: {str(e)}')
                  print(f'✗ {config_file.name}: {str(e)}')

          if errors:
              print(f'\n{len(errors)} config(s) failed validation')
              exit(1)
          else:
              print(f'\nAll configs valid')
          "

  # Test data acquisition jobs in dry-run mode
  # Jobs that don't require secrets will pass
  # Jobs that require secrets will:
  #   1. Pass if secrets are configured in GitHub Secrets
  #   2. Fail with exit code 78 and create an issue if secrets are missing
  test-jobs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - eu/eurlex_legislation      # No required secrets - should pass
          - fr/legifrance_legislation  # Requires PISTE credentials - will fail without them
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test job
        id: test_job
        continue-on-error: true  # Don't fail the whole workflow, we handle it below
        env:
          # Pass secrets from GitHub Secrets (if configured)
          EURLEX_API_KEY: ${{ secrets.EURLEX_API_KEY }}
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
        run: |
          ldf run ${{ matrix.job }} --limit 5 --dry-run
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Create issue for missing credentials
        if: steps.test_job.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const job_id = '${{ matrix.job }}';
            const title = `[BLOCKED] ${job_id}: Missing credentials`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'blocked:credentials'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              return;
            }

            // Create the issue
            const body = `## Credentials Required for \`${job_id}\`

            This job requires credentials that are not currently configured.

            ### How to fix

            1. **Identify required credentials**: Run \`ldf secrets-template ${job_id}\` locally to see what's needed
            2. **Obtain the credentials**: Follow the instructions in the template
            3. **Add to GitHub Secrets**: Go to Settings > Secrets and variables > Actions
            4. **Re-run the workflow**: The job should pass once credentials are configured

            ### Labels
            - \`blocked:credentials\` - This job is blocked until credentials are provided
            - \`human-needed\` - Requires manual intervention

            ---
            *This issue was automatically created by CI.*
            `;

            // Ensure labels exist (create if needed)
            const labelNames = ['blocked:credentials', 'human-needed'];
            for (const labelName of labelNames) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: labelName === 'blocked:credentials' ? 'e99695' : 'd93f0b',
                    description: labelName === 'blocked:credentials'
                      ? 'Blocked: needs credentials/API key'
                      : 'Requires human intervention'
                  });
                  console.log(`Created label: ${labelName}`);
                }
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labelNames
            });

            console.log(`Created issue #${issue.data.number}`);
            core.setOutput('issue_number', issue.data.number);

      - name: Fail if job failed (not due to missing credentials)
        if: steps.test_job.outcome == 'failure'
        run: |
          echo "::error::Job ${{ matrix.job }} failed. Check the logs above."
          echo "If this is a credentials issue, a GitHub issue has been created."
          exit 1
