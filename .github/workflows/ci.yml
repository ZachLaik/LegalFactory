name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic types-PyYAML

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy cli core jobs --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run fixture tests
        run: pytest tests/fixtures -v --tb=short

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate jurisdiction configs
        run: |
          python -c "
          import yaml
          import json
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schema_path = Path('configs/schemas/jurisdiction.schema.json')
          schema = json.loads(schema_path.read_text())

          configs_dir = Path('configs/jurisdictions')
          errors = []

          for config_file in configs_dir.glob('*.yaml'):
              try:
                  with open(config_file) as f:
                      config = yaml.safe_load(f)
                  validate(instance=config, schema=schema)
                  print(f'✓ {config_file.name}')
              except ValidationError as e:
                  errors.append(f'{config_file.name}: {e.message}')
                  print(f'✗ {config_file.name}: {e.message}')
              except Exception as e:
                  errors.append(f'{config_file.name}: {str(e)}')
                  print(f'✗ {config_file.name}: {str(e)}')

          if errors:
              print(f'\n{len(errors)} config(s) failed validation')
              exit(1)
          else:
              print(f'\nAll configs valid')
          "

  # Test data acquisition jobs in dry-run mode
  # Jobs that don't require secrets will pass
  # Jobs that require secrets will:
  #   1. Pass if secrets are configured in GitHub Secrets
  #   2. Fail with exit code 78 and create an issue if secrets are missing
  test-jobs:
    runs-on: ubuntu-latest
    environment: Testing  # Use Testing environment where secrets are configured
    strategy:
      fail-fast: false
      matrix:
        job:
          - eu/eurlex_legislation      # No required secrets - should pass
          - fr/legifrance_legislation  # Requires PISTE credentials - will fail without them
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test job
        id: test_job
        continue-on-error: true  # Don't fail the whole workflow, we handle it below
        env:
          # Pass secrets from GitHub Secrets (if configured)
          EURLEX_API_KEY: ${{ secrets.EURLEX_API_KEY }}
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
        run: |
          set +e  # Don't exit on error
          ldf run ${{ matrix.job }} --limit 5 --dry-run
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          # Exit code 78 = missing credentials (EX_CONFIG)
          if [ $exit_code -eq 78 ]; then
            echo "is_credentials_error=true" >> $GITHUB_OUTPUT
          else
            echo "is_credentials_error=false" >> $GITHUB_OUTPUT
          fi
          exit $exit_code

      - name: Get secrets template
        id: secrets_template
        if: steps.test_job.outcome == 'failure' && steps.test_job.outputs.is_credentials_error == 'true'
        run: |
          # Capture the secrets template output
          template_output=$(ldf secrets-template ${{ matrix.job }} 2>&1 || true)
          # Escape for GitHub Actions output (handle multiline)
          echo "template<<EOF" >> $GITHUB_OUTPUT
          echo "$template_output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create issue for missing credentials
        if: steps.test_job.outcome == 'failure' && steps.test_job.outputs.is_credentials_error == 'true'
        uses: actions/github-script@v7
        env:
          SECRETS_TEMPLATE: ${{ steps.secrets_template.outputs.template }}
        with:
          script: |
            const job_id = '${{ matrix.job }}';
            const run_id = '${{ github.run_id }}';
            const title = `[BLOCKED] ${job_id}: Missing credentials`;
            const secretsTemplate = process.env.SECRETS_TEMPLATE || 'Unable to retrieve secrets template';

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'blocked:credentials'
            });

            // Build URLs
            const secretsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions`;
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;

            const existingIssue = issues.data.find(i => i.title === title);
            if (existingIssue) {
              // Add a comment with the new workflow run link
              const comment = `### Workflow re-run failed\n\nStill missing credentials. [View failed workflow run](${workflowUrl})\n\nOnce you've added the credentials to [GitHub Secrets](${secretsUrl}), re-run the workflow.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: comment
              });

              console.log(`Added comment to existing issue #${existingIssue.number}`);
              core.setOutput('issue_number', existingIssue.number);
              return;
            }

            // Create the issue
            const body = `## Credentials Required for \`${job_id}\`\n\nThis job requires credentials that are not currently configured.\n\n### Required Credentials\n\n\`\`\`\n${secretsTemplate}\n\`\`\`\n\n### How to fix\n\n1. **Obtain the credentials**: Follow the instructions above to get the required API keys/secrets\n2. **Add to GitHub Secrets**: [Settings → Secrets and variables → Actions](${secretsUrl})\n3. **Re-run the workflow**: [Re-run this workflow](${workflowUrl}) once credentials are configured\n\n---\n*This issue was automatically created by CI.*`;

            // Ensure labels exist (create if needed)
            const labelNames = ['blocked:credentials', 'human-needed'];
            for (const labelName of labelNames) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: labelName === 'blocked:credentials' ? 'e99695' : 'd93f0b',
                    description: labelName === 'blocked:credentials'
                      ? 'Blocked: needs credentials/API key'
                      : 'Requires human intervention'
                  });
                  console.log(`Created label: ${labelName}`);
                }
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labelNames
            });

            console.log(`Created issue #${issue.data.number}`);
            core.setOutput('issue_number', issue.data.number);

      - name: Fail if job failed due to missing credentials
        if: steps.test_job.outcome == 'failure' && steps.test_job.outputs.is_credentials_error == 'true'
        run: |
          echo "::error::Job ${{ matrix.job }} requires credentials that are not configured."
          echo "A GitHub issue has been created with instructions."
          exit 1

      - name: Create issue for non-credentials error
        if: steps.test_job.outcome == 'failure' && steps.test_job.outputs.is_credentials_error != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const job_id = '${{ matrix.job }}';
            const run_id = '${{ github.run_id }}';
            const title = `[BUG] ${job_id}: Job failed`;
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'type:bug'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### Workflow failed again\n\n[View failed workflow run](${workflowUrl})`
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
              return;
            }

            // Ensure labels exist
            const labelNames = ['type:bug', 'agent:ready'];
            for (const labelName of labelNames) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color: labelName === 'type:bug' ? 'd73a4a' : '0E8A16',
                    description: labelName === 'type:bug'
                      ? 'Something isn\'t working'
                      : 'Ready for Claude agent to fix'
                  });
                }
              }
            }

            const body = [
              `## Job \`${job_id}\` Failed`,
              '',
              'This job failed with a non-credentials error.',
              '',
              '### Error Details',
              '',
              `[View full logs](${workflowUrl})`,
              '',
              '### For the Agent',
              '',
              '1. Check the workflow logs at the link above',
              '2. Find the root cause of the failure',
              '3. Fix the bug in the code',
              '4. Ensure `ruff check .` and `mypy` pass',
              '',
              '---',
              '*This issue was automatically created by CI and tagged for agent fix.*'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labelNames
            });

            console.log(`Created issue #${issue.data.number} with agent:ready label`);

      - name: Fail if job failed (non-credentials error)
        if: steps.test_job.outcome == 'failure' && steps.test_job.outputs.is_credentials_error != 'true'
        run: |
          echo "::error::Job ${{ matrix.job }} failed with a non-credentials error."
          echo "An issue has been created with the agent:ready label."
          exit 1

  # Fetch sample data and commit to repo
  # This runs after tests pass and fetches real data from APIs
  fetch-sample-data:
    runs-on: ubuntu-latest
    environment: Testing  # Use Testing environment where secrets are configured
    needs: [lint, test, validate-configs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch sample data
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
        run: |
          python scripts/fetch_sample_data.py --all --limit 50

      - name: Commit sample data
        run: |
          git add -f data/samples/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -m "Update sample data from CI

          Auto-generated by fetch_sample_data.py

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
