name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy cli core jobs --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run fixture tests
        run: pytest tests/fixtures -v --tb=short

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate jurisdiction configs
        run: |
          python -c "
          import yaml
          import json
          from pathlib import Path
          from jsonschema import validate, ValidationError

          schema_path = Path('configs/schemas/jurisdiction.schema.json')
          schema = json.loads(schema_path.read_text())

          configs_dir = Path('configs/jurisdictions')
          errors = []

          for config_file in configs_dir.glob('*.yaml'):
              try:
                  with open(config_file) as f:
                      config = yaml.safe_load(f)
                  validate(instance=config, schema=schema)
                  print(f'✓ {config_file.name}')
              except ValidationError as e:
                  errors.append(f'{config_file.name}: {e.message}')
                  print(f'✗ {config_file.name}: {e.message}')
              except Exception as e:
                  errors.append(f'{config_file.name}: {str(e)}')
                  print(f'✗ {config_file.name}: {str(e)}')

          if errors:
              print(f'\n{len(errors)} config(s) failed validation')
              exit(1)
          else:
              print(f'\nAll configs valid')
          "

  # Test data acquisition jobs in dry-run mode
  # Jobs that don't require secrets will pass
  # Jobs that require secrets will:
  #   1. Pass if secrets are configured in GitHub Secrets
  #   2. Fail with exit code 78 and create an issue if secrets are missing
  test-jobs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [eu/eurlex_legislation]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test job with auto-retry
        id: test_job
        uses: nick-fields/retry@v3
        env:
          # Pass secrets from GitHub Secrets (if configured)
          EURLEX_API_KEY: ${{ secrets.EURLEX_API_KEY }}
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          # For automatic issue creation on missing credentials
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          # Don't retry if exit code is 78 (config error / missing credentials)
          retry_on: error
          command: |
            ldf run ${{ matrix.job }} --limit 5 --dry-run
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 78 ]; then
              echo "::error::Job ${{ matrix.job }} requires credentials that are not configured"
              echo "Configure the required secrets in GitHub Settings > Secrets"
              exit 78
            fi
            exit $EXIT_CODE
